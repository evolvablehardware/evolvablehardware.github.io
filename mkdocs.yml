site_name: Evolvable Hardware
site_description: Research and development in evolvable hardware systems
site_author: Evolvable Hardware Community
#site_url: https://evolvablehardware.org

# Repository
repo_name: evolvablehardware/evolvablehardware.github.io
repo_url: https://github.com/evolvablehardware/evolvablehardware.github.io

# Copyright
copyright: Copyright &copy; 2025 Evolvable Hardware Community

# Configuration
theme:
  name: material

  logo: assets/branding/logo.png
  favicon: assets/branding/favicon.png

  language: en
    # If we implement this documentation in multiple languages, look into doing this: https://mrkeo.github.io/setup/changing-the-language/#site-language-selector

  
  # Static files
  static_templates:
    - 404.html
  
  # Customization
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  
  font:
    text: Roboto
    code: Roboto Mono
  
  features:
    # Useful Link: https://mrkeo.github.io/setup/setting-up-navigation/#table-of-contents
    # Defining how tabs behave
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky

    # Defining Navigation & Table Of Contents
    - toc.follow
    #- toc.integrate            # Not compatable with navigation.indexes  | I think this makes the left bar too crowded and discourages thuroughly describing text. It also obfuscates where files start and end.
    #- navigation.expand        #                                         | If included this auto-opens all tabs
    - navigation.indexes        # Not Compatable with toc.integrate       | This allows you to create index.md pages that you enter when you click on a group of pages
    #- navigation.tracking
    - navigation.instant        #                                         | This adjusts how the page loads to better handle large documentation blocks
    - navigation.top            #                                         | If you have a long file, this allows you to 

    # Search
    - search.highlight
    - search.share        # Lets you share your current search.
    - search.suggest
    
    # Content Settings
    - content.code.annotate
    - content.code.copy
    - content.tabs.link

# Plugins
plugins:
  - search:
      separator: '[\s\-,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
      #prebuild_index: true #look into if this site gets really big.
  - redirects:
      redirect_maps: {}
  - minify:
      minify_html: true
  - git-revision-date-localized:
      enabled: true
      type: timeago
      enable_creation_date: true
      fallback_to_build_date: true

# Extensions
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      emoji_index: !!python/name:material.extensions.emoji.twemoji
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      repo_url_shorthand: true
      user: evolvablehardware
      repo: evolvablehardware.github.io
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# Page tree
nav:
  - Home: index.md
  - About: 
    - Overview: about/index.md
    - Research Areas: about/research.md
    - History: about/history.md
  - Resources:
    - Software Tools: resources/software.md
    - Hardware Setup: resources/hardware.md
    - Datasets & Results: resources/datasets.md
  - Publications:
    - Recent Papers: publications/index.md
    - Books: publications/books.md
  - Community:
    - Get Involved: community/members.md
    - Events: community/events.md
  - News: news/index.md
  - Contact: contact.md

# Extra
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/evolvablehardware
      name: Evolvable Hardware GitHub
    - icon: fontawesome/solid/paper-plane
      link: mailto:info@evolvablehardware.org
      name: Message the Evolvable Hardware Email
    - icon: fontawesome/brands/slack
      link: https://www.google.com
      name: Join the EHW Slack!
  # TODO: Look into adding 
  # analytics:
  #   provider: google
  #   property: !ENV GOOGLE_ANALYTICS_KEY
  generator: false #Get rid of "Made by MkDocs on the bottom of the page"

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js